name: Payment safety

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sandbox-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject live checkout code
        run: node .github/scripts/payment-safety.mjs
